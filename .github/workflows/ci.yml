name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test suite, including the mutation tests
        run: PYTHONPATH=src:validation python -m pytest tests/ -q
      - name: Validation registry, and what it declines
        run: python validation/validate_packing.py
      - name: Every example input reaches its documented result
        run: python examples/run_examples.py
      - name: The three quoted figures reproduce
        run: |
          PYTHONPATH=src python experiments/failure_exposure.py
          PYTHONPATH=src python experiments/fragmentation_curve.py
          PYTHONPATH=src python experiments/isolation_cost.py
      - name: The installed console script works
        run: |
          slicepacker --version
          slicepacker example
          slicepacker cordon --shape 16,16,16
          slicepacker shapes 4096 -k 64 -n 3
